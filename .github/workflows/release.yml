name: Build cross-platform binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-script-parse:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Parse Windows PowerShell installers
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem ./scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) { $errors += $parseErrors }
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            exit 1
          }
      - name: Test command process cancellation and timeout
        run: go test ./internal/mcp ./internal/startup
      - name: Smoke-test Windows install lifecycle
        shell: pwsh
        run: ./scripts/test-windows-install-lifecycle.ps1

  build:
    needs: windows-script-parse
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.4"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Check Go formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            printf 'These Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi
      - name: Run static analysis
        run: go vet ./...
      - name: Run security and configuration regressions
        run: go test ./cmd/nexora ./internal/app ./internal/config ./internal/fileaccess ./internal/mcp ./internal/startup
      - name: Smoke-test Unix install lifecycle
        run: bash ./scripts/test-install-lifecycle.sh
      - name: Check UI content security policy
        run: bash ./scripts/check-ui-security.sh
      - name: Check packaging script syntax
        run: bash ./scripts/check-packaging-syntax.sh
      - name: Test release asset inventory gate
        run: python3 ./scripts/test-release-inventory.py
      - name: Set release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build six targets
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-all.sh
      - name: Verify release SHA256 manifest
        run: |
          set -euo pipefail
          test "$(wc -l < dist/SHA256SUMS | tr -d ' ')" -eq 12
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Scan all release binaries for known vulnerabilities
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          scanner="$(go env GOPATH)/bin/govulncheck"
          for binary in dist/Nexora-${VERSION}-*; do
            case "$binary" in
              *.tar.gz|*.zip|*.spdx.json) continue ;;
            esac
            "$scanner" -mode=binary "$binary"
          done
      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2
      - name: Generate per-binary SPDX SBOMs
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          syft="${{ steps.syft.outputs.cmd }}"
          for binary in dist/Nexora-${VERSION}-*; do
            case "$binary" in
              *.tar.gz|*.zip|*.spdx.json) continue ;;
            esac
            "$syft" "$binary" -o spdx-json > "${binary}.spdx.json"
          done
      - name: Verify exact release asset inventory
        env:
          VERSION: ${{ env.VERSION }}
        run: python3 ./scripts/verify-release-inventory.py "$VERSION" dist
      - name: Upload release artifacts for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/Nexora-${{ env.VERSION }}-*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: build
    env:
      VERSION: ${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/Nexora-${{ env.VERSION }}-*
            dist/SHA256SUMS

  publish:
    needs: [build, attest]
    env:
      VERSION: ${{ needs.build.outputs.version }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Publish verified binaries
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: |
            Nexora is a local service configured through a browser. The settings page is split into Overview, Connection, Permissions, and Diagnostics tabs.

            Download the archive matching your operating system and architecture. On macOS or Linux, extract the archive and run `./install-unix.sh ./Nexora`. Start the service with `~/.local/bin/Nexora -no-open`. On Windows, run `install-windows.ps1 -Source .\Nexora.exe` in PowerShell, then launch the installed `Nexora.exe` with `-no-open`.

            The service prints a temporary settings URL. On a headless server, create an SSH local port forward with `ssh -L 18080:127.0.0.1:18080 user@server`, then open the printed URL in a local browser. Both the MCP service and web settings page bind only to loopback.

            See the included README and privacy/data-flow guide before connecting Nexora to ChatGPT.
          files: |
            dist/Nexora-${{ env.VERSION }}-*
            dist/SHA256SUMS
